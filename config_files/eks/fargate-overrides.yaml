# Fargate replacement for sql-server-fraud StatefulSet (EBS PVC -> emptyDir).
# flagd / flagd-ui volume and affinity fixes are applied via patch_fargate_workloads.sh
# (kubectl patch — partial Deployment manifests cannot be kubectl apply'd safely).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sql-server-fraud
  labels:
    app: sql-server-fraud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sql-server-fraud
  template:
    metadata:
      labels:
        app: sql-server-fraud
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: mssql
          image: mcr.microsoft.com/mssql/server:2022-latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 1433
              name: tds
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: MSSQL_PID
              value: Express
            - name: SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mssql-secrets
                  key: SA_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/opt/mssql
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/bash
                  - -c
                  - |
                    sleep 30
                    /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${SA_PASSWORD}" -C -i /docker-entrypoint-initdb.d/init-db.sql
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
          readinessProbe:
            tcpSocket:
              port: 1433
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 1433
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: data
          emptyDir: {}
        - name: init-script
          configMap:
            name: mssql-init-script
